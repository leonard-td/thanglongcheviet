upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 600

opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=32531     ; > tổng ~17k file PHP
opcache.validate_timestamps=1           ; giữ 1 để sửa code thấy ngay
opcache.revalidate_freq=5
opcache.save_comments=1                 ; Filament/attributes cần
realpath_cache_size=8192K
realpath_cache_ttl=600
