# Dev entrypoint — single port (80), no domain/SSL. Fronts every service on
# one origin so the browser (and apps/web's SSR calls) never need CORS:
#   /app/, /admin/, /store/, /health  -> Medusa backend (internal CMS + API)
#   everything else                   -> Nuxt web (apps/web)
#
# Production uses nginx/sites/salon.conf instead (real domain + TLS), with
# the same routing rules.

# Resolve `backend` at request time via Docker's embedded DNS instead of once
# at nginx startup, so nginx keeps working after `backend` restarts and gets a
# new container IP (a static proxy_pass would cache the old one forever).
resolver 127.0.0.11 valid=10s;

# Preserve the ORIGINAL protocol. When an external TLS-terminating proxy fronts
# this stack it sends `X-Forwarded-Proto: https`; we must pass that through
# unchanged, not overwrite it with our own (internal, http) $scheme — otherwise
# Medusa believes the connection is insecure and refuses to set the Secure
# admin session cookie, breaking login even over real HTTPS. Falls back to
# $scheme for direct access with no upstream proxy.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

server {
    listen 80 default_server;
    server_name _;

    absolute_redirect off;
    client_max_body_size 20m;

    location /app/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        # Vite's dev-server HMR websocket needs the upgrade forwarded, or the
        # admin dashboard can never auto-recover from a stale dep-cache/hash
        # after `backend` restarts — it just fails with "Failed to fetch
        # dynamically imported module" until a manual hard reload.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /store/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Medusa authentication (e.g. POST /auth/user/emailpass,
    # /auth/customer/emailpass) — also part of the backend API.
    location /auth/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Remaining Medusa backend prefixes (full set: admin, auth, store, cloud,
    # hooks). /cloud is polled by the admin dashboard; /hooks handles payment
    # provider webhooks. Adding them here so we stop discovering missing
    # prefixes one 404 at a time.
    location /cloud/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /hooks/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Care-channel (Telegram/Zalo) and any other Medusa webhook providers.
    location /webhooks/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Uploaded files (Medusa file-local provider serves them at /static/).
    # MEDUSA_BACKEND_URL points at THIS nginx origin, so every stored file URL
    # resolves through here — without this location they'd fall through to the
    # Nuxt web app and 404.
    location /static/ {
        alias /var/www/medusa-static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location /health {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
