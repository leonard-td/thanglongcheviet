# =============================================================================
# Production stack — runs PREBUILT output only. The build happened on the
# developer machine (build-local.sh, plain Node.js); this host never compiles.
# =============================================================================
# deploy.sh ships ONLY the built artifacts + runtime files here:
#
#   apps/backend/.medusa/server   compiled Medusa API + built admin (no
#                                 node_modules — see the `deps` service)
#   apps/web/.output              self-contained Nitro server (deps bundled)
#   infra/ (this file + nginx config), ops scripts, .env.prod
#
# The one-shot `deps` service is NOT a build step: it only runs
# `npm install --omit=dev` inside the prebuilt backend output (medusa build
# emits a package.json but no node_modules), and re-fetches sharp's native
# binary for linux (the web build machine may be Windows/macOS, whose sharp
# binary can't run here). No TypeScript, no vite, no bundling on this host.
#
# Routing is identical to dev: everything reachable on one port (HTTP_PORT,
# default 8800) via nginx, which routes /app,/admin,/store,/auth,/static,
# /health -> backend:9000 and everything else -> web:3000. Neither app runs a
# Vite dev server (built admin assets + built Nitro server), so the dev-only
# HMR/shared-port issues don't exist here.
#
# NOTE: this uses its own compose project name (tlcv-prod) and its own volumes,
# so its Postgres data is SEPARATE from the dev stack's. Don't run dev and prod
# on the same host at once — they'd fight over the published port.
# =============================================================================

name: tlcv-prod

services:
  # --- PostgreSQL ------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: tlcv-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medusa}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- One-shot: runtime deps for the PREBUILT output (no build!) -------------
  # 1. backend: `medusa build` output ships package.json but no node_modules —
  #    install its runtime deps into a named volume (kept off the deploy dir,
  #    survives redeploys; npm makes the re-run cheap when nothing changed).
  # 2. web: `nuxt build` bundles all deps into .output, but sharp's native
  #    binary is platform-specific — if the build machine wasn't linux-x64,
  #    `npm rebuild sharp` re-downloads the right prebuilt binary (a fetch,
  #    not a compile — node:20 has the toolchain anyway as a fallback).
  
  deps:
    image: node:20
    container_name: tlcv_deps_prod
    working_dir: /workspace
    environment:
      # Keep logs readable; override in prod if you need deep debug.
      - NPM_CONFIG_LOGLEVEL=${NPM_CONFIG_LOGLEVEL:-info}
      # Make installs faster + less flaky on prod hosts.
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      - NPM_CONFIG_FUND=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FETCH_RETRIES=3
      - NPM_CONFIG_FETCH_RETRY_MINTIMEOUT=5000
      - NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT=60000
      # Avoid npm v10 peer-deps ERESOLVE in Medusa runtime output.
      - NPM_CONFIG_LEGACY_PEER_DEPS=true
      # Optional: provide an npm token to avoid registry rate limits (E429).
      - NPM_TOKEN=${NPM_TOKEN:-}
      # sharp: avoid using any host-installed libvips; prefer its own binaries.
      - SHARP_IGNORE_GLOBAL_LIBVIPS=1
    command:
      - sh
      - -c
      - |
          set -e
          if [ -n "$$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$$NPM_TOKEN" > /root/.npmrc
          fi
          echo "Bắt đầu cài đặt dependencies cho Backend (runtime only)..."
          cd /workspace/apps/backend/.medusa/server

          lock_hash=""
          stamp_file="node_modules/.tlcv_package_lock.sha256"
          if [ -f package-lock.json ]; then
            lock_hash="$(sha256sum package-lock.json | cut -d " " -f1)"
          fi

          if [ -n "$$lock_hash" ] && [ -f "$$stamp_file" ] && [ "$$(cat "$$stamp_file")" = "$$lock_hash" ]; then
            echo "Backend deps đã sẵn (lockfile không đổi) — bỏ qua npm install."
          else
            npm install --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund --legacy-peer-deps
            if [ -n "$$lock_hash" ]; then
              echo "$$lock_hash" > "$$stamp_file"
            fi
          fi

          echo "Kiểm tra sharp cho Web..."
          cd /workspace/apps/web/.output/server

          if node -e 'require("sharp")' >/dev/null 2>&1; then
            echo "sharp OK."
          elif [ -d node_modules/sharp ]; then
            echo "sharp bị lỗi (thường do artifact build từ OS khác). Đang cài lại sharp cho Linux..."
            sharp_ver="$(node -p 'require(\"./node_modules/sharp/package.json\").version' 2>/dev/null || true)"
            rm -rf node_modules/sharp node_modules/@img/sharp-* node_modules/@img/sharp-libvips-* || true
            if [ -n "$$sharp_ver" ]; then
              npm install --no-save "sharp@$$sharp_ver" --no-audit --no-fund || true
            else
              npm install --no-save sharp --no-audit --no-fund || true
            fi

            if node -e 'require("sharp")' >/dev/null 2>&1; then
              echo "sharp repaired."
            else
              echo "WARN: sharp vẫn lỗi, nhưng vẫn tiếp tục (web có thể không cần sharp ở runtime)."
            fi
          else
            echo "Không thấy sharp trong .output/server/node_modules — bỏ qua."
          fi

          echo "Hoàn thành!"
    volumes:
      # Thêm :cached hoặc :delegated để tăng tốc độ I/O cực lớn trên Mac/Windows
      - ../:/workspace:cached 
      - backend_server_node_modules:/workspace/apps/backend/.medusa/server/node_modules
      # Persist npm cache between deploys; biggest win for deps runtime speed.
      - npm_cache:/root/.npm
    restart: "no"

  # --- Medusa backend (prebuilt: API + built admin, `medusa start`) ----------
  # Runs from the self-contained build output at .medusa/server (its
  # node_modules come from the `deps` service above), NOT from a source tree —
  # there is no source tree on this host.
  backend:
    image: node:20
    container_name: tlcv_backend_prod
    working_dir: /workspace/apps/backend/.medusa/server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa}
      # Regex (Medusa's cors config treats a /.../-wrapped string as a
      # RegExp) matching any http(s) origin — many domains can point at this
      # same server without listing each one here.
      STORE_CORS: ${STORE_CORS:-/.*/}
      ADMIN_CORS: ${ADMIN_CORS:-/.*/}
      AUTH_CORS: ${AUTH_CORS:-/.*/}
      # Public origin for uploaded-file URLs (file-local provider appends
      # /static; nginx proxies /static/ back to this backend). Only matters
      # for the transient absolute URL returned right after an upload — every
      # URL we persist is normalized to a relative /static/... path (see
      # api/utils/media-url.ts) and nginx proxies /static/ the same way
      # regardless of which domain served the request.
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://localhost:${HTTP_PORT:-8800}}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_CHANNEL_NAME: ${TELEGRAM_CHANNEL_NAME:-}
      TELEGRAM_SEED_SEND_TEST: ${TELEGRAM_SEED_SEND_TEST:-}
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      COOKIE_SECRET: ${COOKIE_SECRET:-supersecret}
      # LOCAL/HTTP ONLY: let the admin session cookie work over plain http
      # (NODE_ENV=production otherwise forces a Secure/HTTPS-only cookie, which
      # the browser drops → every /admin call is 401). Leave unset on a real
      # HTTPS deployment.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - ../:/workspace
      - backend_server_node_modules:/workspace/apps/backend/.medusa/server/node_modules
      # Uploaded files (file-local provider writes to ./static under the
      # working dir) — named volume so uploads outlive redeploys, which wipe
      # and re-extract the surrounding .medusa/server artifact dir.
      - backend_static:/workspace/apps/backend/.medusa/server/static
      # Backup zips (admin Settings > Backup writes to ./.backups under the
      # working dir) — named volume for the same redeploy-survival reason.
      - backend_backups:/workspace/apps/backend/.medusa/server/.backups
    # seed-base runs BEFORE seed-cards: on an empty database it creates the
    # base commerce data (sales channel, VND currency, Vietnam region, stock
    # location + shipping, publishable key) that every /store request needs.
    # The seed scripts were compiled into .medusa/server by the local build.
    command: >
      sh -c "npx medusa db:migrate &&
             (npx medusa exec ./src/scripts/seed-base.js || true) &&
             (npx medusa exec ./src/scripts/seed-cards.js || true) &&
             (npx medusa exec ./src/scripts/seed-care-channel-telegram.js || true) &&
             (npx medusa user -e ${ADMIN_EMAIL:-admin@medusa.local} -p ${ADMIN_PASSWORD:-supersecret123} || true) &&
             npm run start"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # --- Nuxt web (prebuilt Nitro server, deps bundled inside .output) ---------
  # Waits for `deps` only because of the sharp binary fix-up above. All
  # NUXT_PUBLIC_* values are read at RUNTIME by Nitro, so a changed
  # publishable key/region only needs a container recreate, never a rebuild.
  web:
    image: node:20
    container_name: tlcv_web_prod
    working_dir: /workspace/apps/web
    restart: unless-stopped
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # Browser-side Medusa URL — left empty so the browser calls the SAME
      # origin the page was loaded from (nginx proxies /store, /auth, etc.
      # there already), which works for any domain pointed at this server
      # instead of one hardcoded host. The backend's :9000 is internal-only
      # in prod anyway.
      NUXT_PUBLIC_MEDUSA_BACKEND_URL: ${NUXT_PUBLIC_MEDUSA_BACKEND_URL:-}
      # SSR-side override: compose DNS, no round-trip out through nginx.
      NUXT_MEDUSA_BACKEND_URL_SERVER: http://backend:9000
      # Store API credentials for the PROD database (.env.prod).
      NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
      NUXT_PUBLIC_MEDUSA_REGION_ID: ${NUXT_PUBLIC_MEDUSA_REGION_ID:-}
    volumes:
      - ../:/workspace
    command: sh -c "node .output/server/index.mjs"

  # --- nginx (single entrypoint) — SAME image, port, and config as dev -------
  nginx:
    image: nginx:1.25-alpine
    container_name: tlcv_nginx_prod
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # The exact same routing as dev — one port, same proxy rules.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

  # --- Restic DB backup (scheduled PostgreSQL backup) -------------------------
  # Runs pg_dump on a cron schedule, pushes to a Restic repository (local volume
  # by default; switch RESTIC_REPOSITORY to s3: or sftp: for remote storage).
  # Manual restore: docker compose exec backup /scripts/restore.sh [snapshot-id]
  # List snapshots: docker compose exec backup /scripts/restore.sh --list
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: tlcv_backup_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Postgres connection (same creds as backend)
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Restic configuration
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-change-me-restic-password}
      # S3 backend (optional — only needed if RESTIC_REPOSITORY starts with s3:)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Schedule: default 2:00 AM daily (Asia/Ho_Chi_Minh timezone)
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      # Retention policy
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
    volumes:
      # Local backup storage (default). Mount a host directory or use a named
      # volume. Switch to S3/SFTP by changing RESTIC_REPOSITORY.
      - restic_repo:/backups

volumes:
  postgres_data:
  backend_server_node_modules:
  backend_static:
  backend_backups:
  restic_repo:
  npm_cache:
